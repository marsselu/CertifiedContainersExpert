# Definição do HPA para o nginx-deployment
apiVersion: autoscaling/v2  # Versão da API que define um HPA
kind: HorizontalPodAutoscaler  # Tipo de recurso que estamos definindo
metadata:
  name: senhas-deployment-hpa  # Nome do nosso HPA
spec:
  scaleTargetRef:
    apiVersion: apps/v1        # A versão da API do recurso alvo
    kind: Deployment           # O tipo de recurso alvo
    name: giropops-senhas                # O nome do recurso alvo
  minReplicas: 3               # Número mínimo de réplicas
  maxReplicas: 10              # Número máximo de réplicas
  metrics:
  - type: Resource             # Tipo de métrica (recurso do sistema)
    resource:
      name: cpu                # Nome da métrica (CPU neste caso)
      target:
        type: Utilization      # Tipo de alvo (utilização)
        averageUtilization: 50 # Valor alvo (50% de utilização)
  - type: Resource             # Tipo de métrica (recurso do sistema)
    resource:
      name: memory                   # Nome da métrica (memória neste caso)
      target:
        type: Utilization            # Tipo de alvo (utilização)
        averageUtilization: 50       # Valor alvo (60% de utilização)
  behavior: # Configurações de comportamento do HPA
    scaleUp:
      stabilizationWindowSeconds: 5 # Janela de estabilização para scale-up (em segundos)
      policies: # Políticas de escalonamento
      - type: Percent
        value: 100 # Percentual máximo de aumento de réplicas
        periodSeconds: 10 # Período para aplicar a política (em segundos)
    scaleDown: # Configurações para scale-down
      stabilizationWindowSeconds: 60 # Janela de estabilização para scale-down (em segundos)
      policies:
      - type: Percent
        value: 100
        periodSeconds: 100